name: Sync & adapt

on:
  schedule:
    # Sydney time (AEDT): ~6am, ~9am and ~8pm. GitHub can run these a little late.
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync Garmin + Strava and adapt the plan
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: python -m engine.run
      - name: Save
        run: |
          git config user.name "tri-coach bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.enc state/state.enc
          git diff --cached --quiet || git commit -m "Sync $(TZ=Australia/Sydney date '+%a %d %b %H:%M')"
          git pull --rebase --autostash && git push
