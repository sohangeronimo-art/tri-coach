name: Sync & adapt

on:
  schedule:
    # Every ~2 hours from ~5am to ~11pm Sydney (AEDT). Off the hour: GitHub delays/drops more runs at :00.
    - cron: "17 18,20,22 * * *"
    - cron: "17 0,2,4,6,8,10,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", "config/**", "app/**", ".github/workflows/daily.yml", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync Garmin + Strava and adapt the plan
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m engine.run
      - name: Save
        if: always()
        run: |
          git config user.name "tri-coach bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.enc state/state.enc docs/status.json
          git diff --cached --quiet || git commit -m "Sync $(TZ=Australia/Sydney date '+%a %d %b %H:%M')"
          git pull --rebase --autostash && git push
